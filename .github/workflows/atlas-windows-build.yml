name: ATLAS Windows build (unsigned; signing preparation)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atlas-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0
          choco install innosetup --yes --no-progress
      - name: Build ATLAS
        shell: pwsh
        run: |
          $required = @('server.py','ATLAS_Launcher.py','ATLAS.iss','index.html','app.js','style.css')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing application source: $file. Upload the full reviewed source before running." } }
          python -m PyInstaller --noconfirm --clean --onedir --name ATLAS --collect-all certifi --hidden-import http.server --add-data 'server.py;.' --add-data 'index.html;.' --add-data 'app.js;.' --add-data 'style.css;.' --add-data 'assets;assets' ATLAS_Launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc ATLAS.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: SHA-256 checksum
        shell: pwsh
        run: Get-FileHash output/ATLAS-Setup-Windows.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-unsigned
          path: atlas-source/output/ATLAS-Setup-Windows.exe
